<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>محلل عملات بينانس السبوت</title>
    <script>
      try {
        // الافتراضي أبيض — مع احترام اختيار المستخدم المحفوظ من زر التبديل
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
      } catch (e) { /* تجاهل */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html[data-theme="dark"] { background: #0a0e16; }
      html[data-theme="light"] { background: #f7f8fa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
